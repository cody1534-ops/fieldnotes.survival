<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10150e"><link rel="manifest" href="manifest.webmanifest"><title>Field Notes — Survival</title><style>
:root{--ink:#f2ead7;--muted:#c3bba6;--dark:#10150e;--panel:#273222;--line:#607252;--moss:#a9c97b;--amber:#efb15c;--red:#df7366;--blue:#72b7d2;--shadow:#0009}*{box-sizing:border-box}html,body{margin:0;background:var(--dark);color:var(--ink);min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 82% 7%,#526e65 0,transparent 34%),linear-gradient(160deg,#1b2818,#0d120c 70%)}button{font:inherit}#app{width:min(100%,920px);min-height:100vh;margin:auto;padding-bottom:80px}.splash{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 15%,#586e4c 0,transparent 38%),linear-gradient(155deg,#151d14,#090d08 75%)}.splash-card{max-width:490px;text-align:center;padding:36px 27px;background:#1d281bdc;border:1px solid #637755;border-radius:18px;box-shadow:0 20px 70px #000a}.mark{font-size:58px;filter:drop-shadow(0 6px 12px #0008)}.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:800;color:var(--moss);margin-top:12px}.splash h1{font:42px Georgia,serif;margin:7px 0}.splash p{color:var(--muted);line-height:1.55;font-size:15px}.splash .small{font-size:12px}.btn{min-height:44px;width:100%;border-radius:9px;border:1px solid var(--line);background:#384735;color:var(--ink);padding:10px 12px;cursor:pointer;margin-top:9px}.btn.primary{font-weight:800;background:linear-gradient(135deg,#d37c45,var(--amber));color:#18150d;border-color:#f4c273}.btn:disabled{opacity:.45;cursor:not-allowed}.hero{padding:calc(17px + env(safe-area-inset-top)) 18px 17px;background:linear-gradient(135deg,#1d301f,#283322);border-bottom:1px solid var(--line)}.head{display:flex;justify-content:space-between;gap:14px}.eyeline{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--moss);font-weight:800}.day{font:29px Georgia,serif;margin:4px 0}.sub{font-size:13px;color:var(--muted)}.weather{font-size:12px;text-align:right;padding:8px;border:1px solid var(--line);border-radius:8px;background:#182016aa}.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.v{font-size:11px;color:var(--muted)}.vl{display:flex;justify-content:space-between;margin-bottom:5px}.bar{height:9px;border-radius:99px;background:#0c120b;border:1px solid #ffffff1c;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#719754,var(--moss))}.water{background:linear-gradient(90deg,#498ca9,var(--blue))}.warm{background:linear-gradient(90deg,#c95f3e,var(--amber))}.comfort{background:linear-gradient(90deg,#b78b3f,#f2d077)}.health{margin-top:12px}.healthline{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}.healthfill{background:linear-gradient(90deg,#a5413d,var(--red),var(--amber))}.content{padding:16px}.notice{font-size:13px;color:#ffebb9;background:#e9ab5419;border:1px solid #e9ab5473;padding:10px 12px;border-radius:9px;margin-bottom:13px}.section{font:19px Georgia,serif;margin:18px 0 9px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px;background:linear-gradient(155deg,#33402c,#252f21);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 20px #0004}.full{grid-column:1/-1}.card h3{font:17px Georgia,serif;margin:0 0 6px}.desc,.small{font-size:12px;line-height:1.48;color:var(--muted)}.res{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.res div{text-align:center;background:#1c2518;border:1px solid #ffffff12;border-radius:8px;padding:8px 3px;font-size:11px}.res b{display:block;font-size:17px;color:#fff3d7}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.chip{border:1px solid var(--line);border-radius:99px;padding:6px 9px;background:#1b2518;color:var(--ink);font-size:12px;cursor:pointer}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,920px);display:grid;grid-template-columns:repeat(4,1fr);background:#111810f2;border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));z-index:10}.tab{background:none;border:0;color:var(--muted);padding:8px 2px;font-size:11px;cursor:pointer}.tab.active{color:var(--amber);font-weight:800}.toastlayer{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:90;padding:20px}.toast{max-width:360px;opacity:0;transform:translateY(15px);transition:.2s;padding:14px 18px;border:1px solid var(--moss);border-radius:10px;background:#192016f5;box-shadow:0 12px 35px #000b;text-align:center}.toast.show{opacity:1;transform:none}.toast.bad{border-color:var(--red);color:#ffd7d1}.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:18px;background:#071007d7}.modal{width:min(440px,100%);max-height:82vh;overflow:auto;padding:20px;background:#273121;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px #000}.modal h2{font:24px Georgia,serif;margin:0 0 8px}.modal p{font-size:14px;line-height:1.5;color:var(--muted)}@media(min-width:700px){#app{display:grid;grid-template-columns:270px 1fr;padding-bottom:0}.hero{grid-row:1/3;border-right:1px solid var(--line);border-bottom:0}.vitals{grid-template-columns:1fr 1fr}.nav{position:static;transform:none;width:auto;grid-column:1;grid-row:2;align-self:end;display:flex;flex-wrap:wrap}.tab{flex:1 1 45%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"></main><div class="toastlayer" id="toasts" aria-live="assertive"></div><script src="game.js"></script><script>
const KEY='field-notes-start-v1';let persist={achievementsUnlocked:{},bestDay:0},game;const FOOD={jerky:['Beef jerky',18,3],deer:['Venison',34,5],bear:['Bear meat',44,4],chicken:['Roast chicken',30,6],chips:['Potato chips',12,8],canned:['Canned stew',28,8]};function ensure(s){s.foodItems=Object.assign({jerky:1,deer:0,bear:0,chicken:0,chips:1,canned:1},s.foodItems||{});s.conditions=Object.assign({injury:0,illness:0,fatigue:0},s.conditions||{});s.campLocation=s.campLocation||'Riverside Hollow';s.companion=s.companion||null;s.activeTab=s.activeTab||'camp'}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x){persist=x.persist||persist;game=new Game(persist);game.state=Object.assign(defaultState(),x.state||{})}else game=new Game(persist)}catch(e){game=new Game(persist)}ensure(game.state);renderStart()}function save(){localStorage.setItem(KEY,JSON.stringify({persist,state:game.state}))}function toast(x,k='ok'){let l=document.getElementById('toasts');l.innerHTML=`<div class="toast ${k}">${x}</div>`;let n=l.firstElementChild;requestAnimationFrame(()=>n.classList.add('show'));clearTimeout(window.t);window.t=setTimeout(()=>{n.classList.remove('show');setTimeout(()=>l.innerHTML='',250)},2100)}const log=Game.prototype.addLog;Game.prototype.addLog=function(x){log.call(this,x);setTimeout(()=>toast(x,/need|not enough|can't|cannot|full|no traps|already|unavailable/i.test(x)?'bad':'ok'),0)};const adv=Game.prototype.advanceTime;Game.prototype.advanceTime=function(h){ensure(this.state);adv.call(this,h);this.state.conditions.fatigue=Math.min(100,Math.max(0,this.state.conditions.fatigue+h*2-(this.state.hour===6?8:0)))};Game.prototype.eatFoodItem=function(i){ensure(this.state);let s=this.state,f=FOOD[i];if(!s.foodItems[i])return this.addLog('That food is not available.');s.foodItems[i]--;s.hunger=clamp(s.hunger+f[1],0,100);s.comfort=clamp(s.comfort+f[2],0,100);this.addLog(`You eat ${f[0]}. +${f[1]} hunger.`)};Game.prototype.moveCamp=function(){let s=this.state;if(s.inventory.wood<3||s.inventory.cloth<1)return this.addLog('Need 3 wood and 1 cloth to move camp safely.');let p=['Riverside Hollow','Pine Edge','Old Quarry','Meadow Rise'];s.inventory.wood-=3;s.inventory.cloth-=1;s.campLocation=p[(p.indexOf(s.campLocation)+1)%p.length];this.advanceTime(3);s.comfort=clamp(s.comfort+12,0,100);this.addLog('Camp moved to '+s.campLocation+'.')};function start(newRun){if(newRun){game.restart();save()}renderGame()}function renderStart(){let has=localStorage.getItem(KEY);document.getElementById('app').innerHTML=`<section class="splash"><div class="splash-card"><div class="mark">🔥</div><div class="eyebrow">A wilderness survival journal</div><h1>Field Notes</h1><p>Gather supplies, survive changing weather, recover six lost field notes, and repair the beacon before the wilderness takes everything.</p><button class="btn primary" autofocus onclick="start(false)">${has?'Continue your run':'Begin survival'}</button>${has?'<button class="btn" onclick="start(true)">Start a new run</button>':''}<p class="small">Your progress is saved on this device. Best played with sound off or low while testing.</p></div></section>`}function act(n,a){game[n](a);save();renderGame()}function fmt(h){return(h%12||12)+':00 '+(h>=12?'PM':'AM')}function top(s){let w=WEATHERS[s.weather];let v=[['Hunger',s.hunger,''],['Thirst',s.thirst,'water'],['Warmth',s.warmth,'warm'],['Comfort',s.comfort,'comfort']];return `<aside class="hero"><div class="head"><div><div class="eyeline">Field Notes</div><div class="day">Day ${s.day}</div><div class="sub">${s.campLocation}${s.companion?' · '+s.companion:''}</div></div><div class="weather">${w.icon} ${s.weather}<br>${fmt(s.hour)}</div></div><div class="vitals">${v.map(a=>`<div class="v"><div class="vl"><span>${a[0]}</span><span>${Math.round(a[1])}</span></div><div class="bar"><div class="fill ${a[2]}" style="width:${a[1]}%"></div></div></div>`).join('')}</div><div class="health"><div class="healthline"><span>Health</span><span>${Math.round(s.health)}/100</span></div><div class="bar"><div class="fill healthfill" style="width:${s.health}%"></div></div></div></aside>`}function camp(s){let foods=Object.entries(FOOD).filter(([i])=>s.foodItems[i]).map(([i,f])=>`<button class="chip" onclick="act('eatFoodItem','${i}')">${f[0]} ×${s.foodItems[i]}</button>`).join('')||'<span class="small">No specialty food yet.</span>';return `<div class="notice">Condition: Injury ${s.conditions.injury} · Illness ${s.conditions.illness} · Fatigue ${s.conditions.fatigue}. Rest, warmth, bandages, and clean water are your best medicine.</div><div class="section">Camp</div><div class="grid"><div class="card full"><h3>Quick actions</h3><div class="grid"><button class="btn" onclick="act('gatherWood')">🪓 Gather wood · 2h</button><button class="btn" onclick="act('fetchWater')">💧 Fetch water · 2h</button><button class="btn" onclick="act('eat')">🍖 Basic food (${s.inventory.food})</button><button class="btn" onclick="act('drink')">🥤 Drink (${s.inventory.water})</button><button class="btn" onclick="act('restHour')">⏳ Rest one hour</button><button class="btn primary" onclick="act('sleepTillDawn')">🌙 Sleep until dawn</button></div></div><div class="card"><h3>Fire</h3><div class="desc">${s.fireLit?'Burning · '+s.fireFuel+'h fuel':s.builtItems.campfireKit?'Unlit':'Craft Campfire Kit first'}</div><button class="btn" onclick="act('lightFire')">Light fire</button><button class="btn" onclick="act('addFuel')">Add fuel · 2 wood</button></div><div class="card"><h3>Move camp</h3><div class="desc">Costs 3 wood and 1 cloth. Improves comfort.</div><button class="btn" onclick="act('moveCamp')">⛺ Move camp</button></div><div class="card full"><h3>Specialty provisions</h3><div class="chips">${foods}</div></div><div class="card full"><h3>Storage</h3><div class="res">${Object.entries(s.inventory).map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join('')}</div></div></div>`}function explore(s){return `<div class="section">Explore</div><div class="notice">Forest: game and herbs · Riverbank: water and provisions · Ruins: preserved food and scrap · Field: crops and stone. Night trips and storms are riskier.</div><div class="grid">${Object.entries(LOCATIONS).map(([i,l])=>`<div class="card"><h3>${l.icon} ${l.name}</h3><div class="desc">${l.desc}</div><button class="btn primary" onclick="act('startScavenge','${i}')">Explore · 3h</button></div>`).join('')}<div class="card full"><h3>Fishing & traps</h3><div class="grid"><button class="btn" onclick="act('goFishing')">🎣 Fish · 2h</button><button class="btn" onclick="act('setTrap')">Set trap</button><button class="btn" onclick="act('checkTraps')">Check traps (${s.traps.length}/3)</button></div></div></div>`}function craft(s){return `<div class="section">Craft</div><div class="grid">${RECIPES.map(r=>{let ok=Object.entries(r.cost).every(([k,v])=>s.inventory[k]>=v),lock=r.id==='signalBeacon'&&s.counters.fragmentsFound<6;return `<div class="card"><h3>${r.name}</h3><div class="desc">${r.desc}</div><div class="small">${Object.entries(r.cost).map(([k,v])=>v+' '+k).join(', ')}</div><button class="btn ${r.id==='signalBeacon'?'primary':''}" ${(!ok||lock)?'disabled':''} onclick="act('craft','${r.id}')">${lock?'Find all notes':'Craft'}</button></div>`}).join('')}</div>`}function journal(s){return `<div class="section">Journal</div><div class="card"><h3>Field notes</h3><div class="desc">Recovered ${s.counters.fragmentsFound}/6. Repair the signal beacon after finding all six.</div></div><div class="card" style="margin-top:10px"><h3>Recent entries</h3>${s.log.slice(0,12).map(x=>`<div class="small" style="padding:7px 0;border-bottom:1px dashed #ffffff18">Day ${x.day} · ${fmt(x.hour)} — ${x.text}</div>`).join('')||'<div class="small">No entries yet.</div>'}</div><button class="btn" onclick="if(confirm('Reset current run?')){game.restart();save();renderGame()}">Reset run</button>`}function event(s){let e=s.pendingEvent;if(!e)return '';let t=e.kind==='fish'?'Fishing at Riverbank':LOCATIONS[e.locId].name;if(e.result!==null)return `<div class="overlay"><div class="modal"><h2>${t}</h2><p>${e.template}</p><p>${e.result}</p><button class="btn primary" autofocus onclick="act('closeEvent')">Continue</button></div></div>`;return `<div class="overlay"><div class="modal"><h2>${t}</h2><p>${e.template}</p><div class="grid"><button class="btn" autofocus onclick="act('resolveChoice','safe')">Search carefully</button><button class="btn primary" onclick="act('resolveChoice','bold')">Push forward</button><button class="btn" onclick="act('resolveChoice','retreat')">Turn back</button></div></div></div>`}function renderGame(){ensure(game.state);let s=game.state,v=s.activeTab==='camp'?camp(s):s.activeTab==='scavenge'?explore(s):s.activeTab==='craft'?craft(s):journal(s);document.getElementById('app').innerHTML=top(s)+`<section class="content">${v}</section><nav class="nav">${[['camp','⛺ Camp'],['scavenge','🧭 Explore'],['craft','🛠 Craft'],['journal','📓 Journal']].map(x=>`<button class="tab ${s.activeTab===x[0]?'active':''}" onclick="game.state.activeTab='${x[0]}';save();renderGame()">${x[1]}</button>`).join('')}</nav>`+event(s);if(s.gameOver||s.gameWon)document.getElementById('app').innerHTML+=`<div class="overlay"><div class="modal"><h2>${s.gameWon?'📡 Rescued':'☠️ The journal closes'}</h2><p>${s.gameWon?'The beacon catches, and a light answers from the ridge.':'Your run ended on Day '+s.day+'.'}</p><button class="btn primary" onclick="game.restart();save();renderGame()">Start a new run</button></div></div>`}load();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
